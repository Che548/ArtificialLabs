services:
  cv-demo:
    image: ghcr.io/che548/artificiallabs:cv-latest
    container_name: artificiallabs_cv
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8095:3040'
    environment:
      CV_DEMO_PUBLIC_ORIGIN: https://cv.sfera.brainwaves.engineering
      CV_DEMO_DATA_DIR: /data
    volumes:
      - cv-access:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: artificiallabs_cv_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ['--label-enable', '--cleanup', '--interval', '300', 'artificiallabs_cv']
volumes:
  cv-access:
