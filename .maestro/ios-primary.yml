appId: com.anonymous.privateexpo
---
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- extendedWaitUntil:
    visible: 'сфера.'
    timeout: 120000
- tapOn:
    id: 'e2e-auth-identifier'
- assertVisible: ${E2E_EMAIL}
- tapOn:
    id: 'e2e-auth-password'
- inputText: ${E2E_PASSWORD}
- tapOn: 'сфера.'
- tapOn:
    id: 'e2e-auth-consent-personal'
- tapOn:
    id: 'e2e-auth-consent-agreement'
- tapOn:
    id: 'e2e-auth-submit'
- assertVisible:
    id: 'e2e-onboarding-next'
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Немного о вас'
- tapOn:
    id: 'e2e-onboarding-name'
- inputText: 'E2E iOS'
- pressKey: Enter
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Когда началась последняя менструация?'
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Расскажите о цикле'
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Что может влиять на цикл?'
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Разрешения и данные'
- tapOn:
    id: 'e2e-onboarding-next'
- assertVisible: 'Сегодня'
- tapOn: 'Профиль'
- scrollUntilVisible:
    element:
      text: 'Разрешения и данные'
    direction: DOWN
- tapOn: 'Разрешения и данные'
- tapOn:
    id: 'e2e-cloud-sync-toggle'
- tapOn: 'Синхронизировать сейчас'
- assertNotVisible: 'Произошла ошибка'
