appId: com.anonymous.privateexpo
---
# The auth flows finish inside Profile > Permissions.
- tapOn:
    text: 'Вернуться в профиль'

# Seed a deterministic local-first care plan through the same validated import
# UI a user would use. Fresh accounts intentionally have no demo plan.
- scrollUntilVisible:
    element:
      text: 'Импорт данных'
    direction: DOWN
    centerElement: true
- tapOn: 'Импорт данных'
- tapOn: 'Выбрать файл'
- assertVisible: 'Проверено записей: 3'
- tapOn: 'Импортировать 3 записей'
- assertVisible: 'Импортировано записей: 3'
- tapOn:
    text: 'Вернуться в профиль'

- tapOn: 'Сегодня'
- tapOn:
    text: 'Открыть мониторинг'
- extendedWaitUntil:
    visible:
      text: 'Закрыть графики'
    timeout: 30000
- tapOn:
    text: 'Закрыть графики'
- waitForAnimationToEnd
- tapOn:
    text: 'Открыть календарь'
- extendedWaitUntil:
    visible:
      text: 'Закрыть календарь'
    timeout: 30000
- tapOn:
    text: 'Закрыть календарь'
- waitForAnimationToEnd
- tapOn: 'Анализы'
- tapOn: 'Ближайшие'
- assertVisible: 'Гистероскопия'
- tapOn: 'Текущие'
- tapOn:
    text: 'Посмотреть ↗'
    index: 0
- scrollUntilVisible:
    element:
      text: 'Прикрепить файл результата'
    direction: DOWN
- swipe:
    start: '50%,75%'
    end: '50%,35%'
    duration: 500
- tapOn:
    text: 'Прикрепить файл результата'
- tapOn:
    id: 'e2e-analysis-save'
- tapOn: 'Сдано'
- assertVisible: 'Глюкоза'
- tapOn:
    text: 'Открыть графики анализов'
- extendedWaitUntil:
    visible:
      text: 'Закрыть графики'
    timeout: 30000
- tapOn:
    text: 'Закрыть графики'
- waitForAnimationToEnd

- tapOn: 'Сферка'
- tapOn: 'Как определить фертильное окно точнее?'
- tapOn:
    text: 'Отправить сообщение'
- runFlow:
    when:
      visible: 'Согласиться'
    commands:
      - tapOn: 'Согласиться'
- extendedWaitUntil:
    visible: 'Как определить фертильное окно точнее?'
    timeout: 60000
- tapOn:
    text: 'История чатов'
- assertVisible: 'Открыть чат: Как определить фертильное окно точнее?'
- tapOn:
    text: 'Закрыть историю чатов'
- waitForAnimationToEnd
- tapOn:
    text: 'Вернуться к началу чата'
- waitForAnimationToEnd

- tapOn: 'Профиль'
- scrollUntilVisible:
    element:
      text: 'Медицинская история'
    direction: UP
- tapOn: 'Медицинская история'
- tapOn: 'Добавить запись'
- tapOn:
    id: 'e2e-medical-primary'
- inputText: 'E2E condition'
- tapOn:
    id: 'e2e-medical-secondary'
- inputText: 'Local first condition'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'e2e-medical-save'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '74%,93%'
- assertNotVisible:
    id: 'e2e-medical-primary'
- assertVisible: '.*E2E condition.*'
- tapOn:
    text: 'Вернуться в профиль'

- tapOn: 'Препараты'
- tapOn: 'Добавить препарат'
- tapOn:
    id: 'e2e-medical-primary'
- inputText: 'E2E medication'
- tapOn:
    id: 'e2e-medical-secondary'
- inputText: '10 mg'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'e2e-medical-save'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '74%,93%'
- assertNotVisible:
    id: 'e2e-medical-primary'
- assertVisible: '.*E2E medication.*'
- tapOn:
    text: 'Вернуться в профиль'

- tapOn: 'Аллергии и риски'
- tapOn: 'Добавить аллергию'
- tapOn:
    id: 'e2e-medical-primary'
- inputText: 'E2E allergen'
- tapOn:
    id: 'e2e-medical-secondary'
- inputText: 'E2E reaction'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'e2e-medical-save'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '74%,93%'
- assertNotVisible:
    id: 'e2e-medical-primary'
- assertVisible: '.*E2E allergen.*'
- tapOn:
    text: 'Вернуться в профиль'

- scrollUntilVisible:
    element:
      text: 'Программы'
    direction: DOWN
    centerElement: true
- tapOn: 'Программы'
- assertVisible: 'Подключённые программы'
- tapOn:
    text: 'Вернуться в профиль'
- scrollUntilVisible:
    element:
      text: 'Документы'
    direction: UP
    centerElement: true
- tapOn: 'Документы'
- tapOn: 'Добавить документ'
- extendedWaitUntil:
    visible: 'e2e-medical-document.jpg'
    timeout: 30000
- tapOn:
    text: 'Вернуться в профиль'

- scrollUntilVisible:
    element:
      text: 'Настройки уведомлений'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: 'Настройки уведомлений'
- tapOn:
    id: notification-master-toggle
- tapOn:
    text: 'Allow.*|Разрешить.*'
    optional: true
- tapOn: 'Милый'
- extendedWaitUntil:
    visible:
      id: 'e2e-notification-test'
      enabled: true
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'e2e-notification-test'
      enabled: true
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-notification-test'
    enabled: true
- extendedWaitUntil:
    visible: 'Тестовое уведомление появится через пару секунд.|Низкая вероятность'
    timeout: 15000
- runFlow:
    when:
      visible: 'Низкая вероятность'
    commands:
      - tapOn: 'Профиль'
      - scrollUntilVisible:
          element:
            text: 'Настройки уведомлений'
          direction: DOWN
          centerElement: true
      - tapOn: 'Настройки уведомлений'
- tapOn:
    text: 'Вернуться в профиль'

- scrollUntilVisible:
    element:
      text: 'Импорт данных'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: 'Импорт данных'
- tapOn: 'Выбрать файл'
- assertVisible: 'Проверено записей: 3'
- tapOn: 'Импортировать 3 записей'
- assertVisible: 'Импортировано записей: 3'
- tapOn:
    text: 'Вернуться в профиль'

- scrollUntilVisible:
    element:
      text: 'Экспорт данных'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: 'Экспорт данных'
- tapOn: 'Подготовить экспорт'
- assertVisible: 'Файл подготовлен для экспорта.'
- tapOn:
    text: 'Вернуться в профиль'
- scrollUntilVisible:
    element:
      text: 'Разрешения и данные'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: 'Разрешения и данные'
- scrollUntilVisible:
    element:
      id: 'e2e-sync-now'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-sync-now'
- assertNotVisible: 'Произошла ошибка'
- tapOn: 'Вернуться в профиль'
- takeScreenshot: ${E2E_PRODUCT_SCREENSHOT}
