appId: ${MAESTRO_APP_ID || "com.anonymous.privateexpo"}
---
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- runFlow:
    when:
      visible: 'http://localhost:.*'
    commands:
      - tapOn: 'http://localhost:.*'
      - waitForAnimationToEnd
