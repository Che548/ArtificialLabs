appId: ${MAESTRO_APP_ID || "com.anonymous.privateexpo"}
---
# The seed control exists only in a native DEV/E2E build, for the named QA
# profile, with no existing conversations and cloud synchronization OFF.
- tapOn: 'Сферка'
- tapOn: 'История чатов'
- tapOn: 'Создать синтетический QA-диалог'
- extendedWaitUntil:
    visible: 'Открыть чат: Synthetic QA conversation'
    timeout: 30000
- tapOn: 'Открыть чат: Synthetic QA conversation'
- assertVisible: 'Synthetic QA response, not generated by AI.'
- tapOn:
    id: 'chat-conversation-input'
- runFlow:
    file: assert-native-input.yml
    env:
      INPUT_ID: chat-conversation-input
# Keep individual Android driver RPCs short on the large Fold display; the
# combined fixture and subsequent newline/value assertions remain unchanged.
- inputText: 'Synthetic overlay draft. This deliberately long sentence checks wrapping '
- inputText: 'and the visible cursor above the real keyboard. This deliberately long sentence '
- inputText: 'checks wrapping and the visible cursor above the real keyboard. This deliberately '
- inputText: 'long sentence checks wrapping and the visible cursor above the real keyboard.'
- assertVisible: '(?s).*Synthetic overlay draft.*'
- pressKey: Enter
- inputText: 'Explicit second line.'
- assertVisible: '(?s).*keyboard\.\nExplicit second line\..*'
- assertVisible: 'Отправить сообщение'
- takeScreenshot: conversation-keyboard
- tapOn: 'Добавить вложение'
- assertVisible: 'Документы в профиле'
- tapOn: 'Понятно'
- assertVisible: '(?s).*Synthetic overlay draft.*'
- tapOn: 'Чат'
- pressKey: home
- launchApp:
    stopApp: false
    permissions:
      all: unset
- assertVisible: '(?s).*Synthetic overlay draft.*'
- tapOn: 'Вернуться к началу чата'
- assertVisible: '(?s).*Synthetic overlay draft.*'
- tapOn: 'История чатов'
- tapOn: 'Действия с чатом: Synthetic QA conversation'
- tapOn: 'Переименовать'
- tapOn:
    id: 'screen-feedback-input'
- runFlow:
    file: assert-native-input.yml
    env:
      INPUT_ID: screen-feedback-input
- eraseText: 25
- inputText: 'Renamed QA conversation'
- tapOn: 'Сохранить'
- extendedWaitUntil:
    visible: 'Открыть чат: Renamed QA conversation'
    timeout: 30000
- takeScreenshot: conversation-renamed
- tapOn: 'Открыть чат: Renamed QA conversation'
- assertVisible: 'Synthetic QA response, not generated by AI.'
- tapOn: 'Вернуться к началу чата'
- runFlow: open-profile-tab.yml
