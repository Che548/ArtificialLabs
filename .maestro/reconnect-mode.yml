appId: com.anonymous.privateexpo
---
- extendedWaitUntil:
    notVisible: 'Нет подключения'
    timeout: 30000
- tapOn: 'Вернуться в профиль'
- scrollUntilVisible:
    element:
      text: 'Разрешения и данные'
    direction: DOWN
    centerElement: true
- tapOn: 'Разрешения и данные'
- extendedWaitUntil:
    visible: 'Синхронизировать сейчас'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'e2e-sync-now'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-sync-now'
- extendedWaitUntil:
    visible: 'Данные синхронизированы'
    timeout: 120000
- assertNotVisible: 'Произошла ошибка'
- takeScreenshot: ${E2E_RECONNECTED_SCREENSHOT}
