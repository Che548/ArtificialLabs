appId: com.anonymous.privateexpo
---
- extendedWaitUntil:
    visible: 'Нет подключения'
    timeout: 30000
- assertVisible: 'Ожидает подключения'
- tapOn: 'Вернуться в профиль'
- scrollUntilVisible:
    element:
      text: 'Медицинская история'
    direction: UP
    centerElement: true
- tapOn: 'Медицинская история'
- tapOn: 'Добавить запись'
- tapOn:
    id: 'e2e-medical-primary'
- inputText: 'E2E offline condition'
- hideKeyboard
- tapOn:
    id: 'e2e-medical-secondary'
- inputText: 'Saved without network'
- hideKeyboard
- tapOn: 'Сохранить'
- assertVisible: '.*E2E offline condition.*'
- takeScreenshot: ${E2E_OFFLINE_SCREENSHOT}
