name: Remove Published Web Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all ArtificialLabs container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api --paginate \
            "/users/${PACKAGE_OWNER}/packages/container/artificiallabs/versions?per_page=100" \
            --jq '.[].id' |
          while read -r version_id; do
            gh api --method DELETE \
              "/users/${PACKAGE_OWNER}/packages/container/artificiallabs/versions/${version_id}"
          done
