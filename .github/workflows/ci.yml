name: CI

on:
  push:
    branches: ['**'] # Release tags have their own full verification workflow.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
      NEXT_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select affected heavy checks
        id: affected
        run: node scripts/ci-affected.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            CV_Demo_WebAPP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm --prefix admin ci

      - name: Run unit tests
        run: npm test

      - name: Test CI change selection
        run: node --test scripts/ci-affected.test.mjs

      - name: Install StripCV build dependencies
        if: steps.affected.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake libopencv-dev

      - name: Build and smoke-test StripCV
        if: steps.affected.outputs.native == 'true'
        run: npm run test:strip-cv

      - name: Verify CV demo with the shared native reader
        if: steps.affected.outputs.cv == 'true'
        # Use the same OpenCV as deployment; Ubuntu's 4.6 cannot load R2 ONNX.
        run: docker build --target browser-test -f CV_Demo_WebAPP/Dockerfile .

      - name: Verify project
        run: npm run verify
