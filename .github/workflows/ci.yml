name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install StripCV build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake libopencv-dev

      - name: Build and smoke-test StripCV
        run: npm run test:strip-cv

      - name: Verify project
        run: npm run verify
