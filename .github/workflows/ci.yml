name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
      NEXT_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            CV_Demo_WebAPP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm --prefix admin ci

      - name: Install CV demo dependencies
        run: npm --prefix CV_Demo_WebAPP ci

      - name: Run unit tests
        run: npm test

      - name: Install StripCV build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake libopencv-dev

      - name: Build and smoke-test StripCV
        run: npm run test:strip-cv

      - name: Verify CV demo with the shared native reader
        run: npm --prefix CV_Demo_WebAPP run verify

      - name: Install CV demo test browser
        working-directory: CV_Demo_WebAPP
        run: npx playwright install --with-deps chromium

      - name: Test CV demo upload and camera
        working-directory: CV_Demo_WebAPP
        run: npx playwright test tests/learned-flow.spec.ts

      - name: Verify project
        run: npm run verify
