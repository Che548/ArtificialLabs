name: iOS Public Beta

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sfera-ios-public-beta
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    env:
      CI: 'true'
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
      NEXT_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate immutable release candidate
        id: tag
        run: node scripts/ios-release-tag.mjs
      - run: npm ci && npm --prefix admin ci
      - run: node --test scripts/ios-release-tag.test.mjs
      - run: node --test scripts/ci-affected.test.mjs
      - run: node --test scripts/android-release.test.mjs
      - run: npm test
      - name: Native StripCV tests (no skips or relaxed thresholds)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake libopencv-dev
          npm run test:strip-cv
      - name: Verify app and admin
        run: npm run verify
      - name: Install isolated browser test runtimes
        run: npx playwright install --with-deps chromium webkit chrome
      - name: Browser regression suites (synthetic data only)
        run: |
          npm run test:admin-ui
          npm run test:contacts:ui
          npm run test:document-ui
          npm run test:chat-feedback:web
      - name: CV demo tests with deployment OpenCV
        run: docker build --target browser-test -f CV_Demo_WebAPP/Dockerfile .

  testflight:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    environment: ios-public-beta
    permissions:
      contents: write # Private draft release records the tag/SHA/build receipt.
    env:
      CI: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      # Tags version the source, not the TestFlight marketing-version train.
      # Keep public beta on 1.0.0; prepare_beta increments the Apple build number.
      # This does not bypass or guarantee exemption from Apple beta review.
      SFERA_RELEASE_VERSION: '1.0.0'
      EXPO_PUBLIC_GIT_COMMIT: ${{ needs.validate.outputs.sha }}
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
      EXPO_PUBLIC_CONVEX_SITE_URL: https://artificiallabs-convex-site.bebra42.ru
      GH_TOKEN: ${{ github.token }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      TESTFLIGHT_PUBLIC_GROUP_ID: ${{ vars.TESTFLIGHT_PUBLIC_GROUP_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require explicit release configuration
        env:
          IOS_BETA_ENABLED: ${{ vars.IOS_BETA_ENABLED }}
        run: |
          test "$IOS_BETA_ENABLED" = '1' || { echo 'Configure protected tags and ios-public-beta environment first'; exit 1; }
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 TESTFLIGHT_PUBLIC_GROUP_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROFILE_BASE64; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
        shell: bash
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Select supported Xcode explicitly
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - run: npm ci
      - name: Refresh tag validation before reserving build
        run: node scripts/ios-release-tag.mjs
      - name: Reserve build and verify public TestFlight group
        run: bundle exec fastlane ios prepare_beta
      - name: Build pinned OCR native dependencies
        if: env.IOS_BUILD_EXISTS != 'true'
        run: |
          command -v cmake >/dev/null || brew install cmake
          node scripts/prepare-document-ocr.mjs
          node scripts/package-document-ocr-ios.mjs
      - name: Generate native App Store project
        if: env.IOS_BUILD_EXISTS != 'true'
        env:
          SFERA_IOS_APP_STORE: '1'
        run: |
          npx expo prebuild --platform ios --no-install --skip-dependency-update react,react-native
          bundle exec pod install --project-directory=ios
      - name: Build and verify signed archive
        if: env.IOS_BUILD_EXISTS != 'true'
        env:
          SFERA_IOS_APP_STORE: '1'
        run: bundle exec fastlane ios build_beta
      - name: Reject moved or superseded tag before upload
        run: node scripts/ios-release-tag.mjs
      - name: Upload and request external beta distribution
        run: bundle exec fastlane ios deliver_beta
      - name: Remove signing material after failure or cancellation
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sfera-beta.keychain-db" 2>/dev/null || true
          # Fastlane normally removes its exact imported profile and temp directory.
          # Hosted runners are ephemeral; never upload signing files or raw logs.
          echo 'No signing material or application payload is uploaded as a GitHub artifact.'

  android-internal:
    needs: validate
    # Explicit setup gate: missing Google credentials must not affect iOS releases.
    if: vars.ANDROID_INTERNAL_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: google-play-internal
    permissions:
      contents: write # Separate private Android receipt, not the iOS draft.
    env:
      CI: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      SFERA_RELEASE_VERSION: '1.0.0'
      SFERA_ANDROID_PLAY_STORE: '1'
      EXPO_PUBLIC_GIT_COMMIT: ${{ needs.validate.outputs.sha }}
      EXPO_PUBLIC_CONVEX_URL: https://artificiallabs-convex.bebra42.ru
      EXPO_PUBLIC_CONVEX_SITE_URL: https://artificiallabs-convex-site.bebra42.ru
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Require Android configuration
        run: |
          for name in GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_UPLOAD_CERT_SHA256; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
      - name: Validate source and reserve Google versionCode
        run: |
          node scripts/ios-release-tag.mjs
          bundle exec ruby scripts/android-internal-release.rb prepare
      - run: npm ci
      - name: Prepare Android SDK and pinned verifier
        if: env.ANDROID_BUILD_EXISTS != 'true'
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Build signed Android bundle
        if: env.ANDROID_BUILD_EXISTS != 'true'
        run: |
          node scripts/prepare-android-signing.mjs
          node scripts/prepare-document-ocr.mjs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            node scripts/build-document-ocr.mjs "android-$abi"
          done
          npx expo prebuild --platform android --no-install --skip-dependency-update react,react-native
      - name: Compile and verify AAB
        if: env.ANDROID_BUILD_EXISTS != 'true'
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease
          cd ..
          node scripts/verify-android-release.mjs
      - name: Upload to internal testing only
        run: |
          node scripts/ios-release-tag.mjs
          bundle exec ruby scripts/android-internal-release.rb upload
      - name: Remove temporary Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sfera-android-upload.keystore"
          echo 'No Android signing keys, AAB or raw logs are uploaded as GitHub artifacts.'
