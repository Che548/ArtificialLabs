services:
  data-init:
    image: node:24-bookworm-slim
    restart: "no"
    command: ["sh", "-c", "install -d -o 1000 -g 1000 -m 700 /data/assets && find /data -maxdepth 1 -type f -exec chmod 600 {} + && chown -R 1000:1000 /data && chmod 700 /data"]
    volumes:
      - updates_data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  updates:
    build: .
    container_name: artificiallabs_updates
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8094:8094"
    env_file:
      - .env
    volumes:
      - updates_data:/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  updates_data:
    name: artificiallabs_updates_data
