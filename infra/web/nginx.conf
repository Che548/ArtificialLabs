# Public installation host only. Administrative hosts retain the protected app.
server {
    listen 80;
    server_name sfera.brainwaves.engineering;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / { return 302 /beta/; }
    location = /beta { return 302 /beta/; }
    location = /beta/ { try_files /beta/index.html =404; }
    location ^~ /_next/static/ { try_files $uri =404; }
    location ^~ /beta-assets/ { try_files $uri =404; }
    location / { return 404; }
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
